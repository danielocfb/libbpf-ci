name: 'run vmtest'
description: 'Run the kernel tests in a VM and print summary'
inputs:
  arch:
    description: 'arch'
    required: true
  vmlinux:
    description: |
      If passed, this vmlinux will be booted. Otherwise vmlinux is taken
      from kbuild-output.
    required: false
  vmlinuz:
    description: |
      Deprecated and ignored. The VM boots the uncompressed vmlinux.
    required: false
  kernel-root:
    description: 'kernel source dir'
    default: '.'
  max-cpu:
    description: 'Maximum number of CPU allocated to a VM (regardless of number of CPUs available on the host). Default is unset, e.g it will default to the number of CPU on the host.'
    default: ''
  kernel-test:
    description: 'Test to run'
    default: ''
  output-dir:
    description: |
      Some sub-commands produce output dir within VM file system (/command_output/).
      If this option is set that dir's content would be copied to corresponding location.
    default: ''
  kbuild-output:
    description: 'Path to KBUILD_OUTPUT'
    required: false
    default: 'kbuild-output'

runs:
  using: "composite"
  steps:

    - name: Install dependencies
      shell: bash
      run: ${GITHUB_ACTION_PATH}/install-dependencies.sh

    # Builds from source and caches the result keyed on the source hash,
    # so this only costs a full build when the pin below moves.
    - name: Install vmsh
      uses: d-e-s-o/vmsh@496cddb7642985796cd34943d411dcc5db82e580 # v0.1.0

    - name: Allow unprivileged user namespaces
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../helpers.sh"
        foldable start config_userns "Configuring user namespace permissions"
        # vmsh maps the invoking user to root inside the guest through a
        # private user namespace. Ubuntu 24.04 denies that to unconfined
        # binaries unless this is turned off.
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [[ -e "${knob}" ]]; then
          echo 0 | sudo tee "${knob}"
        fi
        foldable end config_userns

    - name: Configure KVM group perms
      shell: bash
      run: |
        source "${GITHUB_ACTION_PATH}/../helpers.sh"
        foldable start config_kvm "Configuring KVM permissions"
        # Only configure kvm perms if kvm is available
        if [[ -e /dev/kvm && ! -w /dev/kvm ]]; then
          echo "Updating KVM permissions"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        fi
        foldable end config_kvm

    - name: Run tests in a VM
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        KBUILD_OUTPUT: ${{ inputs.kbuild-output }}
        KERNEL_ROOT: ${{ inputs.kernel-root }}
        KERNEL_TEST: ${{ inputs.kernel-test }}
        MAX_CPU: ${{ inputs.max-cpu }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        VMLINUX: ${{ inputs.vmlinux || '' }}
      run: |
        ${GITHUB_ACTION_PATH}/run.sh

    # Callers upload this directory with if: always(), and the upload rejects
    # the characters this renames, so it has to happen even when the step
    # above fails.
    - name: Normalize traffic monitor log paths
      if: always()
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/normalize-paths-for-github.sh /tmp/tmon_pcap

